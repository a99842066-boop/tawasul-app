        function deleteMessage(msgId) {
            const convId = window.state.activeConversationId;
            if (!convId || !window.state.messages[convId]) return;

            window.state.messages[convId] = window.state.messages[convId].filter(m => m.id !== msgId);
            
            const msgs = window.state.messages[convId];
            const conv = window.state.conversations.find(c => c.id === convId);
            if (conv) {
                if (msgs.length > 0) {
                    const last = msgs[msgs.length - 1];
                    conv.lastMessage = last.text || (last.audio ? '🎤 رسالة صوتية' : last.image ? '📷 صورة' : last.file ? '📁 مستند' : last.location ? '📍 موقع جغرافي' : '');
                    conv.lastTime = last.time;
                    conv.lastTimestamp = last.timestamp;
                } else {
                    conv.lastMessage = 'لا توجد رسائل';
                }
            }

            saveStateToDB();
            render();

            if (window.state.mqttClient && window.state.isConnectedToNetwork) {
                try {
                    window.state.mqttClient.publish(`${MQTT_PREFIX}/chat/${convId}`, JSON.stringify({
                        type: 'DELETE_MESSAGE',
                        convId: convId,
                        msgId: msgId
                    }));
                } catch(e){}
            }
            showToast('تم حذف الرسالة بنجاح', 'info');
        }

        function deleteStory(storyId) {
            if (!storyId) return;
            if (confirm('هل أنت متأكد من حذف هذه الحالة؟')) {
                window.state.stories = window.state.stories.filter(s => s.id !== storyId);
                
                if (window.state.activeModal === 'view_story' && window.state.modalData?.id === storyId) {
                    window.state.activeModal = null;
                }

                saveStateToDB();
                render();

                if (window.state.mqttClient && window.state.isConnectedToNetwork) {
                    try {
                        window.state.mqttClient.publish(`${MQTT_PREFIX}/stories`, JSON.stringify({
                            type: 'DELETE_STORY',
                            storyId: storyId
                        }));
                    } catch(e){}
                }

                showToast('تم حذف الحالة بنجاح', 'info');
            }
        }

        function attachEventListeners() {
            const welcomeForm = document.getElementById('welcome-login-form');
            if (welcomeForm) {
                welcomeForm.onsubmit = (e) => {
                    e.preventDefault();
                    const name = document.getElementById('username-input').value.trim();
                    if (!name) return;

                    window.state.currentUser = {
                        id: 'usr_' + Date.now(),
                        name: name,
                        accentColor: 'emerald',
                        createdAt: Date.now(),
                        lastSeen: Date.now()
                    };

                    window.state.view = 'main';
                    saveStateToDB();
                    broadcastPresence();
                    setupMQTTConnection();
                    render();
                };
            }

            // Tab Nav
            document.querySelectorAll('.nav-tab-btn').forEach(btn => {
                btn.onclick = () => {
                    window.state.activeTab = btn.getAttribute('data-tab');
                    render();
                };
            });

            // Conversation items
            document.querySelectorAll('.conv-item-card').forEach(card => {
                card.onclick = () => {
                    window.state.activeConversationId = card.getAttribute('data-conv-id');
                    render();
                };
            });

            // Modal Trigger Actions
            const newDirectBtn = document.getElementById('new-direct-chat-btn');
            if (newDirectBtn) newDirectBtn.onclick = () => { window.state.activeModal = 'new_chat'; render(); };

            const createGroupBtn = document.getElementById('create-group-modal-btn');
            if (createGroupBtn) createGroupBtn.onclick = () => { window.state.activeModal = 'new_group'; render(); };

            const createStoryBtn = document.getElementById('create-story-btn');
            if (createStoryBtn) createStoryBtn.onclick = () => { window.state.activeModal = 'new_story'; render(); };

            const tabAddStoryBtn = document.getElementById('tab-add-story-btn');
            if (tabAddStoryBtn) tabAddStoryBtn.onclick = () => { window.state.activeModal = 'new_story'; render(); };

            document.querySelectorAll('.close-modal-btn').forEach(btn => {
                btn.onclick = () => { window.state.activeModal = null; render(); };
            });

            document.querySelectorAll('.view-story-btn').forEach(btn => {
                btn.onclick = () => {
                    const storyId = btn.getAttribute('data-story-id');
                    const story = window.state.stories.find(s => s.id === storyId);
                    if (story) {
                        window.state.activeModal = 'view_story';
                        window.state.modalData = story;
                        render();
                    }
                };
            });

            // Delete story triggers
            document.querySelectorAll('.delete-story-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const storyId = btn.getAttribute('data-story-id');
                    deleteStory(storyId);
                };
            });

            document.querySelectorAll('.img-modal-trigger').forEach(el => {
                el.onclick = () => {
                    window.state.activeModal = 'view_img';
                    window.state.modalData = el.getAttribute('data-img-src');
                    render();
                };
            });

            // Modal Forms Submissions
            const newChatForm = document.getElementById('new-chat-form');
            if (newChatForm) {
                newChatForm.onsubmit = (e) => {
                    e.preventDefault();
                    const targetName = document.getElementById('new-chat-user-input').value.trim();
                    if (!targetName) return;

                    const myId = window.state.currentUser.id;
                    const convId = 'direct_' + Date.now();
                    const newConv = {
                        id: convId,
                        type: 'direct',
                        name: targetName,
                        members: [myId],
                        lastMessage: 'بدء المحادثة...',
                        lastTime: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}),
                        lastTimestamp: Date.now()
                    };
                    window.state.conversations.push(newConv);
                    window.state.activeConversationId = convId;
                    window.state.activeModal = null;
                    saveStateToDB();
                    render();
                };
            }

            const newGroupForm = document.getElementById('new-group-form');
            if (newGroupForm) {
                newGroupForm.onsubmit = (e) => {
                    e.preventDefault();
                    const title = document.getElementById('group-title-input').value.trim();
                    if (!title) return;

                    const selectedCheckboxes = document.querySelectorAll('input[name="group-member"]:checked');
                    const selectedMemberIds = Array.from(selectedCheckboxes).map(cb => cb.value);

                    const otherUsers = window.state.users.filter(u => u.id !== window.state.currentUser?.id);
                    if (otherUsers.length > 0 && selectedMemberIds.length === 0) {
                        showToast('يرجى اختيار عضو واحد على الأقل للمجموعة', 'error');
                        return;
                    }

                    const myId = window.state.currentUser.id;
                    const convId = 'group_' + Date.now();
                    const newConv = {
                        id: convId,
                        type: 'group',
                        name: title,
                        members: [myId, ...selectedMemberIds],
                        lastMessage: 'تم إنشاء المجموعة',
                        lastTime: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}),
                        lastTimestamp: Date.now()
                    };
                    window.state.conversations.push(newConv);
                    window.state.activeConversationId = convId;
                    window.state.activeModal = null;
                    saveStateToDB();
                    render();
                    showToast('تم إنشاء المجموعة بنجاح!', 'success');
                };
            }

            const newStoryForm = document.getElementById('new-story-form');
            if (newStoryForm) {
                newStoryForm.onsubmit = (e) => {
                    e.preventDefault();
                    const text = document.getElementById('story-text-input').value.trim();
                    if (!text) return;

                    const storyObj = {
                        id: 'story_' + Date.now(),
                        userId: window.state.currentUser.id,
                        userName: window.state.currentUser.name,
                        userAvatar: getUserAvatarSVG(window.state.currentUser.name, window.state.currentUser.accentColor),
                        text: text,
                        timestamp: Date.now()
                    };
                    window.state.stories.unshift(storyObj);
                    window.state.activeModal = null;
                    saveStateToDB();

                    if (window.state.mqttClient && window.state.isConnectedToNetwork) {
                        try {
                            window.state.mqttClient.publish(`${MQTT_PREFIX}/stories`, JSON.stringify({
                                type: 'NEW_STORY',
                                story: storyObj
                            }));
                        } catch(err){}
                    }

                    showToast('تم نشر حالتك وبثها لجميع المتصلين!', 'success');
                    render();
                };
            }

            // حذف الرسالة الشخصية
            document.querySelectorAll('.delete-msg-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const msgId = btn.getAttribute('data-msg-id');
                    deleteMessage(msgId);
                };
            });

            // حذف المحادثة الفردية
            const deleteConvBtn = document.getElementById('delete-conv-btn');
            if (deleteConvBtn) {
                deleteConvBtn.onclick = () => {
                    const convId = window.state.activeConversationId;
                    if (!convId) return;
                    if (confirm('هل أنت تأكد من حذف هذه المحادثة بالكامل؟')) {
                        window.state.conversations = window.state.conversations.filter(c => c.id !== convId);
                        delete window.state.messages[convId];
                        window.state.activeConversationId = null;
                        saveStateToDB();
                        render();
                        showToast('تم حذف المحادثة بنجاح', 'info');
                    }
                };
            }

            // عرض أعضاء المجموعة ومغادرتها
            const groupInfoBtn = document.getElementById('group-info-btn');
            if (groupInfoBtn) {
                groupInfoBtn.onclick = () => {
                    window.state.activeModal = 'group_members';
                    render();
                };
            }

            const leaveGroupBtn = document.getElementById('leave-group-btn');
            if (leaveGroupBtn) {
                leaveGroupBtn.onclick = () => {
                    const convId = window.state.activeConversationId;
                    const myId = window.state.currentUser?.id;
                    if (!convId || !myId) return;
                    if (confirm('هل ترغب حقاً بمغادرة هذه المجموعة؟')) {
                        const conv = window.state.conversations.find(c => c.id === convId);
                        if (conv && conv.members) {
                            conv.members = conv.members.filter(id => id !== myId);
                        }
                        window.state.conversations = window.state.conversations.filter(c => c.id !== convId);
                        delete window.state.messages[convId];
                        window.state.activeConversationId = null;
                        saveStateToDB();
                        render();
                        showToast('لقد غادرت المجموعة', 'info');
                    }
                };
            }

            // Call Triggers
            document.querySelectorAll('.init-call-btn').forEach(btn => {
                btn.onclick = () => {
                    const targetId = btn.getAttribute('data-target-id');
                    const targetName = btn.getAttribute('data-target-name');
                    const callType = btn.getAttribute('data-call-type');
                    const callId = 'call_' + Date.now();

                    window.state.activeCall = {
                        id: callId,
                        peerId: targetId,
                        peerName: targetName,
                        type: callType,
                        status: 'ringing',
                        duration: 0
                    };

                    if (window.state.mqttClient) {
                        window.state.mqttClient.publish(`${MQTT_PREFIX}/calls/${targetId}`, JSON.stringify({
                            type: 'CALL_REQUEST',
                            callId: callId,
                            callerId: window.state.currentUser.id,
                            callerName: window.state.currentUser.name,
                            callType: callType
                        }));
                    }

                    render();
                };
            });

            // Accept / Reject Call
            const acceptCallBtn = document.getElementById('accept-call-btn');
            if (acceptCallBtn) {
                acceptCallBtn.onclick = () => {
                    window.state.activeCall.status = 'connected';
                    startCallTimer();
                    if (window.state.mqttClient) {
                        window.state.mqttClient.publish(`${MQTT_PREFIX}/calls/${window.state.activeCall.peerId}`, JSON.stringify({
                            type: 'CALL_RESPONSE',
                            callId: window.state.activeCall.id,
                            accepted: true
                        }));
                    }
                    render();
                };
            }

            const rejectCallBtn = document.getElementById('reject-call-btn');
            if (rejectCallBtn) {
                rejectCallBtn.onclick = () => {
                    if (window.state.mqttClient) {
                        window.state.mqttClient.publish(`${MQTT_PREFIX}/calls/${window.state.activeCall.peerId}`, JSON.stringify({
                            type: 'CALL_RESPONSE',
                            callId: window.state.activeCall.id,
                            accepted: false
                        }));
                    }
                    window.state.activeCall = null;
                    render();
                };
            }

            const endCallBtn = document.getElementById('end-active-call-btn');
            if (endCallBtn) {
                endCallBtn.onclick = () => {
                    if (window.state.mqttClient) {
                        window.state.mqttClient.publish(`${MQTT_PREFIX}/calls/${window.state.activeCall.peerId}`, JSON.stringify({
                            type: 'CALL_END',
                            callId: window.state.activeCall.id
                        }));
                    }
                    window.state.activeCall = null;
                    render();
                };
            }

            // Audio Record Listeners
            const startAudioBtn = document.getElementById('start-audio-rec-btn');
            if (startAudioBtn) {
                startAudioBtn.onclick = async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        window.state.mediaRecorder = new MediaRecorder(stream);
                        window.state.audioChunks = [];

                        window.state.mediaRecorder.ondataavailable = (e) => window.state.audioChunks.push(e.data);
                        window.state.mediaRecorder.start();

                        window.state.isRecordingAudio = true;
                        window.state.recordingTimer = 0;
                        render();

                        window.state.recordingInterval = setInterval(() => {
                            window.state.recordingTimer++;
                            const el = document.getElementById('recording-timer-text');
                            if (el) {
                                const m = Math.floor(window.state.recordingTimer / 60).toString().padStart(2, '0');
                                const s = (window.state.recordingTimer % 60).toString().padStart(2, '0');
                                el.innerText = `${m}:${s}`;
                            }
                        }, 1000);
                    } catch(err) {
                        showToast('يرجى منح السماح لاستخدام المايكروفون', 'error');
                    }
                };
            }

            const stopSendAudioBtn = document.getElementById('stop-send-audio-btn');
            if (stopSendAudioBtn) {
                stopSendAudioBtn.onclick = () => {
                    if (!window.state.mediaRecorder) return;
                    clearInterval(window.state.recordingInterval);

                    window.state.mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(window.state.audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            sendChatMessage('', null, e.target.result);
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    window.state.mediaRecorder.stop();
                    window.state.isRecordingAudio = false;
                };
            }

            const cancelAudioBtn = document.getElementById('cancel-audio-rec-btn');
            if (cancelAudioBtn) {
                cancelAudioBtn.onclick = () => {
                    if (window.state.mediaRecorder) window.state.mediaRecorder.stop();
                    clearInterval(window.state.recordingInterval);
                    window.state.isRecordingAudio = false;
                    render();
                };
            }

            // File Attachment
            const attachFileBtn = document.getElementById('attach-file-btn');
            const fileInput = document.getElementById('chat-file-input');
            if (attachFileBtn && fileInput) {
                attachFileBtn.onclick = () => fileInput.click();
                fileInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        if (file.type.startsWith('image/')) {
                            sendChatMessage('', ev.target.result);
                        } else {
                            sendChatMessage('', null, null, {
                                name: file.name,
                                size: (file.size / 1024).toFixed(1) + ' KB',
                                data: ev.target.result
                            });
                        }
                    };
                    reader.readAsDataURL(file);
                };
            }

            // Location sharing
            const shareLocBtn = document.getElementById('share-location-btn');
            if (shareLocBtn) {
                shareLocBtn.onclick = () => {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition((pos) => {
                            sendChatMessage('', null, null, null, {
                                lat: pos.coords.latitude,
                                lng: pos.coords.longitude
                            });
                        }, () => showToast('تعذر تعقب الموقع الجغرافي', 'error'));
                    }
                };
            }

            // Emoji Toggle
            const toggleEmojiBtn = document.getElementById('toggle-emoji-picker-btn');
            if (toggleEmojiBtn) {
                toggleEmojiBtn.onclick = () => {
                    window.state.showEmojiPicker = !window.state.showEmojiPicker;
                    render();
                };
            }

            document.querySelectorAll('.insert-emoji-btn').forEach(btn => {
                btn.onclick = () => {
                    const emoji = btn.getAttribute('data-emoji');
                    const input = document.getElementById('chat-message-input');
                    if (input) input.value += emoji;
                };
            });

            // Settings & Profile Navigation
            const openProf = document.getElementById('open-profile-btn');
            if (openProf) openProf.onclick = () => { window.state.view = 'profile'; render(); };

            const openSettingsBtn = document.getElementById('open-settings-btn');
            if (openSettingsBtn) openSettingsBtn.onclick = () => { window.state.activeTab = 'settings'; render(); };

            const appBtn = document.getElementById('appearance-btn');
            if (appBtn) appBtn.onclick = () => { window.state.view = 'appearance'; render(); };

            const backBtn = document.getElementById('back-to-list-btn');
            if (backBtn) backBtn.onclick = () => { window.state.activeConversationId = null; render(); };

            const closeProfBtn = document.getElementById('close-profile-screen-btn');
            if (closeProfBtn) closeProfBtn.onclick = () => { window.state.view = 'main'; render(); };

            const closeAppBtn = document.getElementById('close-appearance-btn');
            if (closeAppBtn) closeAppBtn.onclick = () => { window.state.view = 'main'; render(); };

            // Toggle Dark Mode
            const toggleDarkBtn = document.getElementById('toggle-darkmode-btn');
            if (toggleDarkBtn) {
                toggleDarkBtn.onclick = () => {
                    window.state.darkMode = !window.state.darkMode;
                    if (window.state.darkMode) document.documentElement.classList.add('dark');
                    else document.documentElement.classList.remove('dark');
                    saveStateToDB();
                    render();
                };
            }

            // Search input
            const globalSearchInput = document.getElementById('global-search-input');
            if (globalSearchInput) {
                globalSearchInput.oninput = (e) => {
                    window.state.searchQuery = e.target.value;
                    render();
                };
            }

            // Settings Checkboxes
            const soundCb = document.getElementById('toggle-sound-cb');
            if (soundCb) soundCb.onchange = (e) => { window.state.soundEnabled = e.target.checked; saveStateToDB(); };

            const notifCb = document.getElementById('toggle-notif-cb');
            if (notifCb) notifCb.onchange = (e) => { window.state.notificationsEnabled = e.target.checked; saveStateToDB(); };

            const clearDataBtn = document.getElementById('clear-data-btn');
            if (clearDataBtn) {
                clearDataBtn.onclick = () => {
                    if (confirm('هل أنت تأكد من مسح جميع المحادثات والبيانات بالكامل؟')) {
                        localStorage.clear();
                        window.state.currentUser = null;
                        window.state.conversations = [];
                        window.state.messages = {};
                        window.state.stories = [];
                        window.state.view = 'welcome';
                        render();
                    }
                };
            }

            // Direct Chat Start
            document.querySelectorAll('.start-direct-chat-btn').forEach(btn => {
                btn.onclick = () => {
                    const targetId = btn.getAttribute('data-user-id');
                    const targetName = btn.getAttribute('data-user-name');
                    const myId = window.state.currentUser.id;
                    const convId = getDeterministicDirectConvId(myId, targetId);

                    let existing = window.state.conversations.find(c => c.id === convId);
                    if (!existing) {
                        existing = {
                            id: convId,
                            type: 'direct',
                            name: targetName,
                            members: [myId, targetId],
                            lastMessage: 'بدء المحادثة...',
                            lastTime: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}),
                            lastTimestamp: Date.now()
                        };
                        window.state.conversations.push(existing);
                        saveStateToDB();
                    }

                    window.state.activeConversationId = convId;
                    window.state.activeTab = 'chats';
                    render();
                };
            });

            // Text messaging form
            const chatForm = document.getElementById('active-chat-form');
            if (chatForm) {
                chatForm.onsubmit = (e) => {
                    e.preventDefault();
                    const input = document.getElementById('chat-message-input');
                    const text = input.value.trim();
                    if (!text) return;

                    sendChatMessage(text);
                    input.value = '';
                };
            }

            // Pin conversation button
            const togglePinConvBtn = document.getElementById('toggle-pin-conv-btn');
            if (togglePinConvBtn) {
                togglePinConvBtn.onclick = () => {
                    const convId = window.state.activeConversationId;
                    window.state.pinnedConvs[convId] = !window.state.pinnedConvs[convId];
                    saveStateToDB();
                    render();
                    showToast(window.state.pinnedConvs[convId] ? 'تم تثبيت المحادثة في البداية' : 'تم إلغاء تثبيت المحادثة', 'info');
                };
            }

            // Scroll down
            const msgContainer = document.getElementById('messages-container');
            if (msgContainer) msgContainer.scrollTop = msgContainer.scrollHeight;
        }

        function sendChatMessage(text = '', image = null, audio = null, file = null, location = null) {
            const myId = window.state.currentUser?.id;
            const convId = window.state.activeConversationId;
            if (!myId || !convId) return;

            const now = Date.now();
            const timeStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

            const msgObj = {
                id: 'msg_' + now + '_' + Math.floor(Math.random() * 1000),
                conversationId: convId,
                senderId: myId,
                senderName: window.state.currentUser.name,
                text: text,
                image: image,
                audio: audio,
                file: file,
                location: location,
                time: timeStr,
                timestamp: now
            };

            if (!window.state.messages[convId]) window.state.messages[convId] = [];
            window.state.messages[convId].push(msgObj);

            const conv = window.state.conversations.find(c => c.id === convId);
            const msgSnippet = text || (audio ? '🎤 رسالة صوتية' : image ? '📷 صورة' : file ? '📁 مستند' : location ? '📍 موقع جغرافي' : '');
            
            if (conv) {
                conv.lastMessage = msgSnippet;
                conv.lastTime = timeStr;
                conv.lastTimestamp = now;
            }

            playAppSound('send');
            saveStateToDB();
            render();

            if (window.state.mqttClient && window.state.isConnectedToNetwork) {
                try {
                    window.state.mqttClient.publish(`${MQTT_PREFIX}/chat/${convId}`, JSON.stringify({
                        type: 'CHAT_MESSAGE',
                        senderName: window.state.currentUser.name,
                        senderAvatar: getUserAvatarSVG(window.state.currentUser.name, window.state.currentUser.accentColor),
                        convType: conv?.type || 'direct',
                        message: msgObj
                    }));
                } catch(e){}
            }
        }

        window.onload = async function() {
            if (window.lucide) lucide.createIcons();
            await initDB();
            await loadStateFromDB();
            setupMQTTConnection();

            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 500);
                }
                window.state.view = window.state.currentUser ? 'main' : 'welcome';
                render();
            }, 1000);
        };
    </script>
</body>
</html>
