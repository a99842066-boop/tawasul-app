<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تواصل - منصة المراسلة المباشرة الشاملة</title>
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#10b981" id="meta-theme-color">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    },
                    animation: {
                        'pulse-subtle': 'pulseSubtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-short': 'bounceShort 0.5s ease-out 1',
                        'fade-in': 'fadeIn 0.25s ease-out forwards',
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards'
                    },
                    keyframes: {
                        pulseSubtle: {
                            '0%, 100%': { opacity: 1 },
                            '50%': { opacity: 0.7 }
                        },
                        bounceShort: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' }
                        },
                        fadeIn: {
                            'from': { opacity: 0, transform: 'scale(0.97)' },
                            'to': { opacity: 1, transform: 'scale(1)' }
                        },
                        slideUp: {
                            'from': { opacity: 0, transform: 'translateY(15px)' },
                            'to': { opacity: 1, transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- External Libraries -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        input, textarea {
            user-select: text;
        }
        body {
            font-family: 'Cairo', sans-serif;
            touch-action: manipulation;
            overscroll-behavior-y: none;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.5);
        }

        /* Wallpapers Patterns */
        .wp-solid { background-color: transparent; }
        .wp-doodle {
            background-image: radial-gradient(rgba(16, 185, 129, 0.12) 1.5px, transparent 1.5px);
            background-size: 20px 20px;
        }
        .wp-grid {
            background-image: linear-gradient(to right, rgba(100, 116, 139, 0.08) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(100, 116, 139, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .pb-safe { padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
        .pt-safe { padding-top: max(0.75rem, env(safe-area-inset-top)); }
    </style>
</head>

<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200 overflow-hidden select-none">

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 z-[100] bg-slate-900 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative flex flex-col items-center">
            <div class="w-24 h-24 bg-emerald-500 rounded-3xl flex items-center justify-center shadow-2xl shadow-emerald-500/40 animate-bounce-short mb-6">
                <i data-lucide="message-square" class="w-12 h-12 text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-wide mb-2">تَوَاصُل</h1>
            <p class="text-xs text-emerald-400 font-medium tracking-widest uppercase mb-8">منصة المراسلة السحابية المتكاملة</p>
            <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></div>
                <span id="splash-status-text" class="text-xs text-slate-400 font-medium">جاري إعداد المنصة...</span>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div id="app" class="h-full w-full flex flex-col"></div>

    <script type="module">
        const MQTT_PREFIX = 'tawasul_pro_v5_mesh';

        // Global State
        window.state = {
            currentUser: null,       
            users: [],               
            conversations: [],       
            messages: {},            
            stories: [],             
            activeConversationId: null,
            activeTab: 'chats',      
            view: 'splash',          
            darkMode: false,
            accentColor: 'emerald',   
            chatWallpaper: 'wp-doodle',
            searchQuery: '',
            inChatSearchQuery: '',
            isInChatSearchOpen: false,
            pinnedMessageId: null,
            replyToMessage: null,
            editingMessage: null,
            isConnectedToNetwork: false,
            mqttClient: null,
            notificationsEnabled: true,
            soundEnabled: true,
            mutedConvs: {},
            pinnedConvs: {},
            showEmojiPicker: false,
            
            // Audio Recording State
            isRecordingAudio: false,
            mediaRecorder: null,
            audioChunks: [],
            recordingTimer: 0,
            recordingInterval: null,

            // Active Call State
            activeCall: null,

            // Modal System State
            activeModal: null, // 'new_chat', 'new_group', 'new_story', 'view_story', 'view_img', 'group_members'
            modalData: null
        };

        const DB_NAME = 'TawasulStorageDB_v2';

        function initDB() {
            return new Promise((resolve) => {
                try {
                    const request = indexedDB.open(DB_NAME, 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('app_state')) {
                            db.createObjectStore('app_state', { keyPath: 'key' });
                        }
                    };
                    request.onsuccess = (e) => resolve(e.target.result);
                    request.onerror = () => resolve(null);
                } catch(e) {
                    resolve(null);
                }
            });
        }

        async function saveStateToDB() {
            try {
                if (window.state.currentUser) {
                    localStorage.setItem('tawasul_cur_user', JSON.stringify(window.state.currentUser));
                } else {
                    localStorage.removeItem('tawasul_cur_user');
                }
                localStorage.setItem('tawasul_users', JSON.stringify(window.state.users));
                localStorage.setItem('tawasul_convs', JSON.stringify(window.state.conversations));
                localStorage.setItem('tawasul_msgs', JSON.stringify(window.state.messages));
                localStorage.setItem('tawasul_stories', JSON.stringify(window.state.stories));
                localStorage.setItem('tawasul_settings', JSON.stringify({
                    darkMode: window.state.darkMode,
                    accentColor: window.state.accentColor,
                    chatWallpaper: window.state.chatWallpaper,
                    notificationsEnabled: window.state.notificationsEnabled,
                    soundEnabled: window.state.soundEnabled,
                    mutedConvs: window.state.mutedConvs,
                    pinnedConvs: window.state.pinnedConvs
                }));
            } catch(e) { console.warn('Storage save err', e); }
        }

        async function loadStateFromDB() {
            try {
                const curUser = localStorage.getItem('tawasul_cur_user');
                const users = localStorage.getItem('tawasul_users');
                const convs = localStorage.getItem('tawasul_convs');
                const msgs = localStorage.getItem('tawasul_msgs');
                const stories = localStorage.getItem('tawasul_stories');
                const settings = localStorage.getItem('tawasul_settings');

                if (curUser) window.state.currentUser = JSON.parse(curUser);
                if (users) window.state.users = JSON.parse(users);
                if (convs) window.state.conversations = JSON.parse(convs);
                if (msgs) window.state.messages = JSON.parse(msgs);
                if (stories) window.state.stories = JSON.parse(stories);

                if (settings) {
                    const parsed = JSON.parse(settings);
                    window.state.darkMode = parsed.darkMode ?? false;
                    window.state.accentColor = parsed.accentColor || 'emerald';
                    window.state.chatWallpaper = parsed.chatWallpaper || 'wp-doodle';
                    window.state.notificationsEnabled = parsed.notificationsEnabled ?? true;
                    window.state.soundEnabled = parsed.soundEnabled ?? true;
                    window.state.mutedConvs = parsed.mutedConvs || {};
                    window.state.pinnedConvs = parsed.pinnedConvs || {};
                }

                if (window.state.darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch(e) { console.warn('State restore err', e); }
        }

        function playAppSound(type = 'receive') {
            if (!window.state.soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                if (type === 'send') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                } else if (type === 'ring') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                }

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-wrapper');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-2xl shadow-xl text-white text-xs font-semibold flex items-center gap-2 animate-slide-up backdrop-blur-md ${
                type === 'success' ? 'bg-emerald-600/95' : type === 'error' ? 'bg-rose-600/95' : 'bg-slate-800/95'
            }`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info'}" class="w-4 h-4"></i><span>${msg}</span>`;
            
            container.appendChild(toast);
            if (window.lucide) lucide.createIcons();

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function setupMQTTConnection() {
            if (typeof mqtt === 'undefined') {
                window.state.isConnectedToNetwork = false;
                render();
                return;
            }

            const brokers = [
                'wss://broker.emqx.io:8084/mqtt',
                'wss://test.mosquitto.org:8081/mqtt',
                'wss://broker.hivemq.com:8884/mqtt'
            ];
            let bIdx = 0;
            let currentClient = null;

            function connectNext() {
                if (currentClient) {
                    try { currentClient.end(true); } catch(e){}
                }

                const clientId = 'tawasul_' + Math.random().toString(36).substring(2, 9);
                try {
                    const client = mqtt.connect(brokers[bIdx], { 
                        clientId, 
                        keepalive: 30, 
                        clean: true, 
                        connectTimeout: 5000,
                        reconnectPeriod: 0 
                    });

                    currentClient = client;

                    client.on('connect', () => {
                        window.state.isConnectedToNetwork = true;
                        window.state.mqttClient = client;

                        client.subscribe(`${MQTT_PREFIX}/presence`);
                        client.subscribe(`${MQTT_PREFIX}/chat/#`);
                        if (window.state.currentUser?.id) {
                            client.subscribe(`${MQTT_PREFIX}/calls/${window.state.currentUser.id}`);
                        }
                        client.subscribe(`${MQTT_PREFIX}/stories`);

                        broadcastPresence();
                        render();
                    });

                    client.on('message', (topic, payload) => {
                        handleIncomingNetworkData(topic, payload.toString());
                    });

                    client.on('error', () => { switchBroker(); });
                    client.on('close', () => { 
                        if (window.state.isConnectedToNetwork) {
                            window.state.isConnectedToNetwork = false; 
                            render();
                        }
                    });

                } catch(e) { switchBroker(); }
            }

            function switchBroker() {
                window.state.isConnectedToNetwork = false;
                bIdx = (bIdx + 1) % brokers.length;
                setTimeout(connectNext, 3000);
            }

            connectNext();
            setInterval(broadcastPresence, 20000);
        }

        function broadcastPresence() {
            if (!window.state.mqttClient || !window.state.currentUser) return;
            window.state.currentUser.lastSeen = Date.now();
            try {
                window.state.mqttClient.publish(`${MQTT_PREFIX}/presence`, JSON.stringify({
                    type: 'PRESENCE_PING',
                    user: window.state.currentUser
                }));

                const myStories = window.state.stories.filter(s => s.userId === window.state.currentUser?.id || s.userName === window.state.currentUser?.name);
                myStories.forEach(s => {
                    window.state.mqttClient.publish(`${MQTT_PREFIX}/stories`, JSON.stringify({
                        type: 'NEW_STORY',
                        story: s
                    }));
                });
            } catch(e){}
        }

        function handleIncomingNetworkData(topic, rawPayload) {
            try {
                const data = JSON.parse(rawPayload);
                const myId = window.state.currentUser?.id;

                if (data.type === 'PRESENCE_PING' && data.user) {
                    if (data.user.id === myId) return;
                    const idx = window.state.users.findIndex(u => u.id === data.user.id);
                    if (idx >= 0) window.state.users[idx] = data.user;
                    else window.state.users.push(data.user);
                    saveStateToDB();
                    render();
                }

                if (data.type === 'DELETE_MESSAGE' && data.convId && data.msgId) {
                    if (window.state.messages[data.convId]) {
                        window.state.messages[data.convId] = window.state.messages[data.convId].filter(m => m.id !== data.msgId);
                        saveStateToDB();
                        render();
                    }
                }

                if (data.type === 'CHAT_MESSAGE' && data.message) {
                    const msg = data.message;
                    const convId = msg.conversationId;
                    if (msg.senderId === myId) return;

                    if (!window.state.messages[convId]) window.state.messages[convId] = [];
                    if (!window.state.messages[convId].some(m => m.id === msg.id)) {
                        window.state.messages[convId].push(msg);

                        let conv = window.state.conversations.find(c => c.id === convId);
                        const msgSnippet = msg.text || (msg.audio ? '🎤 رسالة صوتية' : msg.image ? '📷 صورة' : msg.file ? '📁 مستند' : msg.location ? '📍 موقع جغرافي' : '');
                        
                        if (!conv) {
                            conv = {
                                id: convId,
                                type: data.convType || 'direct',
                                name: data.senderName || 'محادثة جديدة',
                                avatar: data.senderAvatar || null,
                                members: [myId, msg.senderId],
                                lastMessage: msgSnippet,
                                lastTime: msg.time,
                                lastTimestamp: msg.timestamp
                            };
                            window.state.conversations.push(conv);
                        } else {
                            conv.lastMessage = msgSnippet;
                            conv.lastTime = msg.time;
                            conv.lastTimestamp = msg.timestamp;
                        }

                        saveStateToDB();
                        if (!window.state.mutedConvs[convId]) {
                            playAppSound('receive');
                            if (window.state.notificationsEnabled) {
                                showToast(`رسالة جديدة من ${data.senderName}: ${msgSnippet}`, 'success');
                            }
                        }
                        render();
                    }
                }

                if (data.type === 'CALL_REQUEST' && data.targetId === myId) {
                    window.state.activeCall = {
                        id: data.callId,
                        peerId: data.callerId,
                        peerName: data.callerName,
                        type: data.callType,
                        status: 'ringing',
                        duration: 0
                    };
                    playAppSound('ring');
                    render();
                }

                if (data.type === 'CALL_RESPONSE' && window.state.activeCall && window.state.activeCall.id === data.callId) {
                    if (data.accepted) {
                        window.state.activeCall.status = 'connected';
                        startCallTimer();
                    } else {
                        showToast('تم رفض المكالمة من الطرف الآخر', 'info');
                        window.state.activeCall = null;
                    }
                    render();
                }

                if (data.type === 'CALL_END' && window.state.activeCall) {
                    window.state.activeCall = null;
                    showToast('تم إنهاء المكالمة', 'info');
                    render();
                }

                if (data.type === 'NEW_STORY' && data.story) {
                    if (!window.state.stories.some(s => s.id === data.story.id)) {
                        window.state.stories.unshift(data.story);
                        saveStateToDB();
                        render();
                    }
                }

                if (data.type === 'DELETE_STORY' && data.storyId) {
                    window.state.stories = window.state.stories.filter(s => s.id !== data.storyId);
                    if (window.state.activeModal === 'view_story' && window.state.modalData?.id === data.storyId) {
                        window.state.activeModal = null;
                    }
                    saveStateToDB();
                    render();
                }
            } catch(e) {}
        }

        let callTimerInterval = null;
        function startCallTimer() {
            if (callTimerInterval) clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                if (window.state.activeCall && window.state.activeCall.status === 'connected') {
                    window.state.activeCall.duration++;
                    const timerEl = document.getElementById('call-timer-display');
                    if (timerEl) {
                        const mins = Math.floor(window.state.activeCall.duration / 60).toString().padStart(2, '0');
                        const secs = (window.state.activeCall.duration % 60).toString().padStart(2, '0');
                        timerEl.innerText = `${mins}:${secs}`;
                    }
                } else {
                    clearInterval(callTimerInterval);
                }
            }, 1000);
        }

        function getUserAvatarSVG(name, accent = 'emerald') {
            const initial = (name || 'م').trim().charAt(0).toUpperCase();
            const accentMap = { emerald: '#10b981', indigo: '#6366f1', amber: '#f59e0b', rose: '#f43f5e', cyan: '#06b6d4' };
            const color = accentMap[accent] || '#10b981';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="${color}"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="bold" font-size="46" fill="#ffffff">${initial}</text></svg>`;
            return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
        }

        function isUserOnline(user) {
            if (!user || !user.lastSeen) return false;
            return (Date.now() - user.lastSeen) < 80000;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function getDeterministicDirectConvId(id1, id2) {
            const sorted = [id1, id2].sort();
            return `direct_${sorted[0]}_${sorted[1]}`;
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            app.innerHTML = '';

            if (window.state.view === 'welcome') {
                app.innerHTML = renderWelcomeScreen();
            } else if (window.state.view === 'main') {
                app.innerHTML = renderMainLayout();
            } else if (window.state.view === 'profile') {
                app.innerHTML = renderProfileSettingsScreen();
            } else if (window.state.view === 'appearance') {
                app.innerHTML = renderAppearanceScreen();
            }

            // Toast layer
            const toastWrapper = document.createElement('div');
            toastWrapper.id = 'toast-wrapper';
            toastWrapper.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[110] flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none';
            app.appendChild(toastWrapper);

            // Modal Layer
            if (window.state.activeModal) {
                const modalLayer = document.createElement('div');
                modalLayer.id = 'modal-layer';
                modalLayer.innerHTML = renderModalContent();
                if (modalLayer.firstElementChild) app.appendChild(modalLayer.firstElementChild);
            }

            // Call Overlay Layer
            if (window.state.activeCall) {
                const callOverlay = document.createElement('div');
                callOverlay.innerHTML = renderCallOverlay(window.state.activeCall);
                if (callOverlay.firstElementChild) app.appendChild(callOverlay.firstElementChild);
            }

            if (window.lucide) lucide.createIcons();
            attachEventListeners();
        }

        function renderWelcomeScreen() {
            return `
                <div class="h-full w-full flex flex-col items-center justify-center p-6 bg-gradient-to-br from-emerald-600/10 via-slate-900 to-slate-950">
                    <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-8 shadow-2xl border border-slate-200 dark:border-slate-800 text-center relative overflow-hidden animate-fade-in">
                        <div class="w-20 h-20 bg-emerald-500 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-emerald-500/30">
                            <i data-lucide="shield-check" class="w-10 h-10 text-white"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">أهلاً بك في تَوَاصُل 🌐</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mb-6 leading-relaxed">
                            مراسلات فورية، مكالمات مرئية وصوتية، تسجيلات صوتية، وحالات سريعة بدون تعقيدات!
                        </p>

                        <form id="welcome-login-form" class="space-y-4 text-right">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">اسم المستخدم الحصري</label>
                                <input type="text" id="username-input" placeholder="اكتب اسمك هنا..." required class="w-full px-4 py-3 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            </div>

                            <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2">
                                <span>دخول المنصة</span>
                                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderMainLayout() {
            const activeConv = window.state.conversations.find(c => c.id === window.state.activeConversationId);
            const activeMsgs = activeConv ? (window.state.messages[activeConv.id] || []) : [];

            return `
                <div class="h-full w-full flex flex-col md:flex-row overflow-hidden bg-slate-100 dark:bg-slate-950">
                    <aside class="w-full md:w-80 lg:w-96 flex flex-col bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 ${window.state.activeConversationId ? 'hidden md:flex' : 'flex'} flex-1 md:flex-none">
                        
                        <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between pt-safe">
                            <div class="flex items-center gap-3 cursor-pointer" id="open-profile-btn">
                                <img src="${getUserAvatarSVG(window.state.currentUser?.name, window.state.currentUser?.accentColor)}" class="w-10 h-10 rounded-2xl object-cover ring-2 ring-emerald-500/30">
                                <div class="min-w-0">
                                    <h2 class="font-bold text-slate-900 dark:text-white text-sm truncate">${escapeHtml(window.state.currentUser?.name || 'مستخدم')}</h2>
                                    <p class="text-[10px] ${window.state.isConnectedToNetwork ? 'text-emerald-500' : 'text-amber-500'} font-semibold flex items-center gap-1">
                                        <span class="w-2 h-2 rounded-full ${window.state.isConnectedToNetwork ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}"></span>
                                        ${window.state.isConnectedToNetwork ? 'متصل بالشبكة 🌐' : 'وضع بدون اتصال 📱'}
                                    </p>
                                </div>
                            </div>
                            <div class="flex items-center gap-1">
                                <button id="appearance-btn" class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl" title="المظهر والأنماط">
                                    <i data-lucide="palette" class="w-5 h-5"></i>
                                </button>
                                <button id="open-settings-btn" class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl" title="الإعدادات">
                                    <i data-lucide="settings" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>

                        ${renderStoriesBar()}

                        <div class="flex-1 overflow-y-auto">
                            ${renderTabContent()}
                        </div>

                        <nav class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center justify-around py-2 px-1 pb-safe z-20">
                            <button class="nav-tab-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl ${window.state.activeTab === 'chats' ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-400'}" data-tab="chats">
                                <i data-lucide="message-square" class="w-5 h-5"></i>
                                <span class="text-[10px]">المحادثات</span>
                            </button>
                            <button class="nav-tab-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl ${window.state.activeTab === 'stories' ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-400'}" data-tab="stories">
                                <i data-lucide="circle-dashed" class="w-5 h-5"></i>
                                <span class="text-[10px]">الحالات</span>
                            </button>
                            <button class="nav-tab-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl ${window.state.activeTab === 'groups' ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-400'}" data-tab="groups">
                                <i data-lucide="users" class="w-5 h-5"></i>
                                <span class="text-[10px]">المجموعات</span>
                            </button>
                            <button class="nav-tab-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl ${window.state.activeTab === 'search' ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-400'}" data-tab="search">
                                <i data-lucide="search" class="w-5 h-5"></i>
                                <span class="text-[10px]">البحث</span>
                            </button>
                            <button class="nav-tab-btn flex flex-col items-center gap-1 px-3 py-1 rounded-xl ${window.state.activeTab === 'settings' ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-400'}" data-tab="settings">
                                <i data-lucide="sliders" class="w-5 h-5"></i>
                                <span class="text-[10px]">الإعدادات</span>
                            </button>
                        </nav>
                    </aside>

                    <main class="flex-1 flex flex-col bg-slate-50 dark:bg-slate-950 ${!window.state.activeConversationId ? 'hidden md:flex' : 'flex'} relative h-full">
                        ${activeConv ? renderChatRoomView(activeConv, activeMsgs) : renderEmptyChatRoomState()}
                    </main>
                </div>
            `;
        }

        function renderStoriesBar() {
            return `
                <div class="p-3 border-b border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 flex items-center gap-3 overflow-x-auto">
                    <div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer" id="create-story-btn">
                        <div class="relative w-12 h-12 rounded-2xl bg-emerald-500/10 border-2 border-dashed border-emerald-500 flex items-center justify-center text-emerald-600">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </div>
                        <span class="text-[10px] font-bold text-slate-600 dark:text-slate-400">حالتك</span>
                    </div>

                    ${window.state.stories.map(s => `
                        <div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer view-story-btn" data-story-id="${s.id}">
                            <div class="w-12 h-12 rounded-2xl ring-2 ring-emerald-500 p-0.5 overflow-hidden">
                                <img src="${s.userAvatar}" class="w-full h-full object-cover rounded-xl">
                            </div>
                            <span class="text-[10px] font-bold text-slate-700 dark:text-slate-300 truncate w-12 text-center">${escapeHtml(s.userName)}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderTabContent() {
            if (window.state.activeTab === 'chats') return renderChatsTab();
            if (window.state.activeTab === 'stories') return renderStoriesTab();
            if (window.state.activeTab === 'groups') return renderGroupsTab();
            if (window.state.activeTab === 'search') return renderSearchTab();
            if (window.state.activeTab === 'settings') return renderSettingsTab();
            return renderChatsTab();
        }

        function renderChatsTab() {
            let convs = window.state.conversations.filter(c => c.type !== 'group');
            convs.sort((a, b) => {
                const pinA = window.state.pinnedConvs[a.id] ? 1 : 0;
                const pinB = window.state.pinnedConvs[b.id] ? 1 : 0;
                if (pinA !== pinB) return pinB - pinA;
                return (b.lastTimestamp || 0) - (a.lastTimestamp || 0);
            });

            return `
                <div class="p-3 space-y-2">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-slate-500 dark:text-slate-400">المحادثات المباشرة (${convs.length})</span>
                        <button id="new-direct-chat-btn" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>محادثة جديدة</span>
                        </button>
                    </div>

                    ${convs.length === 0 ? `
                        <div class="p-8 text-center text-slate-400">
                            <i data-lucide="message-circle-off" class="w-10 h-10 mx-auto mb-2 text-emerald-500/60"></i>
                            <p class="text-xs font-bold text-slate-600 dark:text-slate-300">لا توجد محادثات فردية</p>
                            <p class="text-[11px] text-slate-400 mt-1">اضغط "محادثة جديدة" للبدء!</p>
                        </div>
                    ` : convs.map(c => renderConvCard(c)).join('')}
                </div>
            `;
        }

        function renderStoriesTab() {
            const myUserId = window.state.currentUser?.id;
            const myUserName = window.state.currentUser?.name;

            return `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-xs font-bold text-slate-500 dark:text-slate-400">حالات الشبكة الفورية</h3>
                        <button id="tab-add-story-btn" class="px-3 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-bold flex items-center gap-1">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>نشر حالة</span>
                        </button>
                    </div>

                    <div class="space-y-3">
                        ${window.state.stories.length === 0 ? `
                            <p class="text-center text-xs text-slate-400 py-8">لا توجد حالات منشورة حالياً. كن أول من ينشر حالة!</p>
                        ` : window.state.stories.map(s => {
                            const isMyStory = s.userId === myUserId || s.userName === myUserName;
                            return `
                                <div class="p-3 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200/60 dark:border-slate-700/60 flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <img src="${s.userAvatar}" class="w-10 h-10 rounded-xl object-cover ring-2 ring-emerald-500">
                                        <div>
                                            <h4 class="text-xs font-bold text-slate-900 dark:text-white">${escapeHtml(s.userName)} ${isMyStory ? '<span class="text-[10px] text-emerald-500">(أنت)</span>' : ''}</h4>
                                            <p class="text-[10px] text-slate-400">${new Date(s.timestamp).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-1.5">
                                        <button class="view-story-btn px-3 py-1.5 bg-slate-100 dark:bg-slate-700 text-xs font-bold rounded-xl" data-story-id="${s.id}">
                                            عرض
                                        </button>
                                        ${isMyStory ? `
                                            <button class="delete-story-btn p-1.5 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-xl transition-colors" data-story-id="${s.id}" title="حذف الحالة">
                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderGroupsTab() {
            let groups = window.state.conversations.filter(c => c.type === 'group');
            return `
                <div class="p-3 space-y-2">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-slate-500 dark:text-slate-400">المجموعات (${groups.length})</span>
                        <button id="create-group-modal-btn" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm">
                            <i data-lucide="users" class="w-4 h-4"></i>
                            <span>إنشاء مجموعة</span>
                        </button>
                    </div>

                    ${groups.length === 0 ? `
                        <div class="p-8 text-center text-slate-400">
                            <i data-lucide="users-round" class="w-10 h-10 mx-auto mb-2 text-emerald-500/60"></i>
                            <p class="text-xs font-bold text-slate-600 dark:text-slate-300">لا توجد مجموعات حتى الآن</p>
                        </div>
                    ` : groups.map(g => renderConvCard(g)).join('')}
                </div>
            `;
        }

        function renderConvCard(c) {
            const myId = window.state.currentUser?.id;
            let title = c.name;
            let avatar = c.avatar || getUserAvatarSVG(c.name);

            if (c.type !== 'group') {
                const otherUserId = c.members ? c.members.find(id => id !== myId) : null;
                const otherUser = window.state.users.find(u => u.id === otherUserId);
                if (otherUser) {
                    title = otherUser.name;
                    avatar = getUserAvatarSVG(otherUser.name, otherUser.accentColor);
                }
            }

            const isActive = c.id === window.state.activeConversationId;
            const isPinned = window.state.pinnedConvs[c.id];

            return `
                <div class="conv-item-card flex items-center gap-3 p-3 rounded-2xl cursor-pointer transition-all ${isActive ? 'bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-500/30' : 'hover:bg-slate-100 dark:hover:bg-slate-800/60'}" data-conv-id="${c.id}">
                    <img src="${avatar}" class="w-11 h-11 rounded-2xl object-cover shrink-0">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-0.5">
                            <h4 class="font-bold text-slate-900 dark:text-white text-xs truncate flex items-center gap-1">
                                ${escapeHtml(title)}
                                ${isPinned ? '<i data-lucide="pin" class="w-3 h-3 text-emerald-500 fill-emerald-500"></i>' : ''}
                            </h4>
                            <span class="text-[10px] text-slate-400 whitespace-nowrap">${c.lastTime || ''}</span>
                        </div>
                        <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate">${escapeHtml(c.lastMessage || 'بدء المحادثة...')}</p>
                    </div>
                </div>
            `;
        }

        function renderSearchTab() {
            const query = window.state.searchQuery.trim().toLowerCase();
            const matchedUsers = window.state.users.filter(u => u.id !== window.state.currentUser?.id && u.name.toLowerCase().includes(query));

            return `
                <div class="p-4 space-y-4">
                    <div class="relative">
                        <input type="text" id="global-search-input" value="${escapeHtml(window.state.searchQuery)}" placeholder="ابحث عن اسم مستخدم..." class="w-full pl-4 pr-10 py-2.5 bg-slate-100 dark:bg-slate-800 rounded-2xl text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute right-3.5 top-3"></i>
                    </div>

                    <div class="space-y-2">
                        <span class="text-xs font-bold text-slate-500 dark:text-slate-400">الأشخاص المتصلون على الشبكة (${matchedUsers.length})</span>
                        ${matchedUsers.length === 0 ? `
                            <p class="text-xs text-slate-400 py-4 text-center">لا توجد نتائج متطابقة.</p>
                        ` : matchedUsers.map(u => `
                            <div class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-800/40 rounded-2xl">
                                <div class="flex items-center gap-3">
                                    <img src="${getUserAvatarSVG(u.name, u.accentColor)}" class="w-9 h-9 rounded-xl">
                                    <div>
                                        <h5 class="text-xs font-bold text-slate-900 dark:text-white">${escapeHtml(u.name)}</h5>
                                        <span class="text-[10px] text-emerald-500 font-semibold">${isUserOnline(u) ? 'متصل الآن 🟢' : 'غير متصل'}</span>
                                    </div>
                                </div>
                                <button class="start-direct-chat-btn px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold" data-user-id="${u.id}" data-user-name="${escapeHtml(u.name)}">
                                    مراسلة
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderSettingsTab() {
            return `
                <div class="p-4 space-y-4">
                    <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl space-y-3">
                        <h4 class="text-xs font-bold text-slate-900 dark:text-white">التنبيهات والأصوات</h4>
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="text-xs text-slate-700 dark:text-slate-300">أصوات التنبيهات</span>
                            <input type="checkbox" id="toggle-sound-cb" ${window.state.soundEnabled ? 'checked' : ''} class="w-4 h-4 text-emerald-600 rounded">
                        </label>
                        <label class="flex items-center justify-between cursor-pointer">
                            <span class="text-xs text-slate-700 dark:text-slate-300">إشعارات الرسائل</span>
                            <input type="checkbox" id="toggle-notif-cb" ${window.state.notificationsEnabled ? 'checked' : ''} class="w-4 h-4 text-emerald-600 rounded">
                        </label>
                    </div>

                    <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-2xl space-y-2">
                        <h4 class="text-xs font-bold text-slate-900 dark:text-white">البيانات والأمان</h4>
                        <button id="clear-data-btn" class="w-full py-2.5 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 hover:bg-rose-100 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                            <span>مسح بيانات التطبيق كلياً</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderEmptyChatRoomState() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center select-none">
                    <div class="w-20 h-20 bg-emerald-500/10 text-emerald-500 rounded-3xl flex items-center justify-center mb-4">
                        <i data-lucide="messages-square" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 dark:text-slate-200 mb-2">منصة تَوَاصُل السحابية</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm leading-relaxed">
                        اختر محادثة للبدء المباشر بالمراسلات النصية والصوتية والمكالمات المرئية!
                    </p>
                </div>
            `;
        }

        function renderChatRoomView(conv, messages) {
            const myId = window.state.currentUser?.id;
            let title = conv.name;
            let avatar = conv.avatar || getUserAvatarSVG(conv.name);
            let targetUserId = null;

            if (conv.type !== 'group') {
                targetUserId = conv.members ? conv.members.find(id => id !== myId) : null;
                const otherUser = window.state.users.find(u => u.id === targetUserId);
                if (otherUser) {
                    title = otherUser.name;
                    avatar = getUserAvatarSVG(otherUser.name, otherUser.accentColor);
                }
            }

            const pinnedMsg = messages.find(m => m.id === window.state.pinnedMessageId);

            return `
                <div class="px-4 py-3 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between z-10 pt-safe">
                    <div class="flex items-center gap-3">
                        <button id="back-to-list-btn" class="md:hidden p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl">
                            <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                        <img src="${avatar}" class="w-10 h-10 rounded-2xl object-cover">
                        <div>
                            <h3 class="font-bold text-slate-900 dark:text-white text-xs sm:text-sm flex items-center gap-1.5">
                                ${escapeHtml(title)}
                            </h3>
                            <span class="text-[10px] text-slate-400">${conv.type === 'group' ? `أعضاء المجموعة (${conv.members?.length || 1})` : 'متصل بالسحابة 🟢'}</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-1">
                        ${conv.type === 'group' ? `
                            <button id="group-info-btn" class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl" title="عرض أعضاء المجموعة">
                                <i data-lucide="users" class="w-4 h-4"></i>
                            </button>
                            <button id="leave-group-btn" class="p-2 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-xl" title="مغادرة المجموعة">
                                <i data-lucide="log-out" class="w-4 h-4"></i>
                            </button>
                        ` : `
                            <button id="delete-conv-btn" class="p-2 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-xl" title="حذف المحادثة">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        `}

                        ${conv.type !== 'group' && targetUserId ? `
                            <button class="init-call-btn p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl" data-call-type="audio" data-target-id="${targetUserId}" data-target-name="${escapeHtml(title)}" title="مكالمة صوتية">
                                <i data-lucide="phone" class="w-4 h-4"></i>
                            </button>
                            <button class="init-call-btn p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl" data-call-type="video" data-target-id="${targetUserId}" data-target-name="${escapeHtml(title)}" title="مكالمة فيديو">
                                <i data-lucide="video" class="w-4 h-4"></i>
                            </button>
                        ` : ''}
                        
                        <button id="toggle-pin-conv-btn" class="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl" title="تثبيت المحادثة">
                            <i data-lucide="pin" class="w-4 h-4 ${window.state.pinnedConvs[conv.id] ? 'text-emerald-500 fill-emerald-500' : ''}"></i>
                        </button>
                    </div>
                </div>

                ${pinnedMsg ? `
                    <div class="px-4 py-2 bg-emerald-50 dark:bg-emerald-950/60 border-b border-emerald-500/20 flex items-center justify-between text-xs text-emerald-800 dark:text-emerald-300">
                        <div class="flex items-center gap-2 truncate">
                            <i data-lucide="pin" class="w-4 h-4 text-emerald-600 shrink-0"></i>
                            <span class="font-bold">رسالة مثبتة:</span>
                            <span class="truncate">${escapeHtml(pinnedMsg.text || 'مرفق')}</span>
                        </div>
                        <button id="unpin-msg-btn" class="p-1 hover:bg-emerald-200/50 rounded-lg">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                ` : ''}

                <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 ${window.state.chatWallpaper}">
                    ${messages.length === 0 ? `
                        <div class="h-full flex flex-col items-center justify-center text-slate-400">
                            <i data-lucide="send" class="w-8 h-8 mb-2 opacity-50"></i>
                            <p class="text-xs font-semibold">أرسل رسالتك الأولى في هذه المحادثة!</p>
                        </div>
                    ` : filterMessages(messages).map(m => renderSingleMessageBubble(m)).join('')}
                </div>

                ${window.state.showEmojiPicker ? renderEmojiPicker() : ''}

                ${window.state.isRecordingAudio ? `
                    <div class="p-3 bg-rose-50 dark:bg-rose-950/60 border-t border-rose-500/30 flex items-center justify-between animate-pulse">
                        <div class="flex items-center gap-3">
                            <div class="w-3 h-3 rounded-full bg-rose-600 animate-ping"></div>
                            <span class="text-xs font-bold text-rose-700 dark:text-rose-300">جاري تسجيل مقطع صوتي...</span>
                            <span id="recording-timer-text" class="text-xs font-mono font-bold text-rose-800 dark:text-rose-200">00:00</span>
                        </div>
                        <div class="flex items-center gap-2">

        function filterMessages(messages) {
            if (!window.state.isInChatSearchOpen || !window.state.inChatSearchQuery.trim()) return messages;

            return messages.filter(m => (m.text && m.text.toLowerCase().includes(q)));
